# Render Blueprint for cursor-byok.
# Render dashboard: New > Blueprint > choose this repository > Apply.
services:
  - type: web
    name: cursor-byok
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Persistent disks need a paid plan. On "free", remove the "disk" block below;
    # the SQLite database (models, keys, settings) is then wiped on every deploy and restart.
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /__byok-api__/healthz
    envVars:
      # Render routes public traffic to this port.
      - key: PORT
        value: "3000"
      - key: CURSOR_LISTEN_ADDR
        value: 0.0.0.0:3000
      - key: CURSOR_DATABASE_URL
        value: sqlite:///data/cursor-server.db
      - key: CURSOR_CONSOLE_DIR
        value: /app/console
      # CA, plugins and caches; on the disk so the CA survives redeploys.
      - key: CURSOR_DATA_DIR
        value: /data/cursor-byok-v3
      # Add the CA to the container's trust store at startup (the store is reset on each deploy).
      - key: CURSOR_TRUST_CA
        value: "1"
      - key: RUST_LOG
        value: cursor_server=info
    disk:
      name: cursor-byok-data
      mountPath: /data
      sizeGB: 1
