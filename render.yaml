# Render Blueprint for cursor-byok.
# Render dashboard: New > Blueprint > choose this repository > Apply.
services:
  - type: web
    name: cursor-byok
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Persistent disks need a paid plan. On "free", remove the "disk" block below;
    # the SQLite database (models, keys, settings) is then wiped on every deploy and restart.
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /__byok-api__/healthz
    envVars:
      # Render routes public traffic to this port.
      - key: PORT
        value: "3000"
      - key: CURSOR_LISTEN_ADDR
        value: 0.0.0.0:3000
      - key: CURSOR_DATABASE_URL
        value: sqlite:///data/cursor-server.db
      - key: CURSOR_CONSOLE_DIR
        value: /app/console
      # Password for the console and control API at /__byok-api__/ (HTTP Basic, any username).
      # Render generates it on the first Blueprint sync; read it under Environment.
      # Without it the server, which listens on 0.0.0.0, turns the console off.
      - key: CURSOR_CONSOLE_PASSWORD
        generateValue: true
      - key: RUST_LOG
        value: cursor_server=info
    disk:
      name: cursor-byok-data
      mountPath: /data
      sizeGB: 1
